
services:
  db_api:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_ganadera
      POSTGRES_USER: ganadero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganadero -d gestion_ganadera"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5437:5432"
    volumes:
      - postgres_api_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db_api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://ganadero:${POSTGRES_PASSWORD}@db_api:5432/gestion_ganadera"
      ENVIRONMENT: "development"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8001:8000"

volumes:
  postgres_api_data:
